<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETEC306 安防监控</title>
<style>
body { font-family: "SimSun", "Songti SC", serif; font-size: 14px; margin: 6px; background: #e8e8e8; }
td, th { font-size: 13px; padding: 2px 6px; text-align: left; }
th { background: #d4d4d4; font-weight: bold; white-space: nowrap; }
table.box { border-collapse: collapse; background: white; width: 100%; }
table.box td, table.box th { border: 1px solid #888; }
fieldset { border: 1px solid #888; background: #f4f4f4; margin: 0 0 6px 0; padding: 4px 6px; }
legend { font-weight: bold; }
.ALARM { background: red; color: white; } .LOCKED { background: yellow; } .KNOWN { background: #3c3; color: white; } .UNKNOWN { background: red; color: white; } .VERIFY { background: #ffd; }
.ARMED { background: #7c7; } .DISARMED { background: #ccc; }
/* two columns: video (bigger) left, radar / events / identity right; stacks on narrow screens */
#main { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
#left { flex: 3 1 560px; min-width: 280px; }
#right { flex: 2 1 340px; min-width: 280px; }
.wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: black; border: 1px solid #444; }
#cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#face { position: absolute; right: 4px; top: 4px; width: 22%; max-width: 160px; aspect-ratio: 1; border: 2px solid lime; display: none; background: black; }
#plot { width: 100%; aspect-ratio: 16 / 10; border: 1px solid #000; background: white; display: block; }
#events { font-size: 12px; height: 260px; overflow: auto; background: white; border: 1px solid #888; padding: 2px; }
#snaps img { width: 120px; margin: 1px; }
@media (max-width: 600px) { #events { height: 180px; } input[type=button] { padding: 6px 8px; margin: 2px 0; } }
</style>
<script src="/i18n.js"></script>
<script src="/common.js"></script>
</head>
<body>
<table width="100%" border="0"><tr>
<td><b>ETEC306 边缘-云协同智能安防系统</b> &nbsp; <span id="clock"></span> <font color="red" id="conn"></font></td>
<td align="right"><input type="button" value="人脸录入" onclick="location.href='/enroll.html'"> <input type="button" value="设置" onclick="location.href='/settings.html'"></td>
</tr></table>
<hr>
<div id="main">
<div id="left">
<div class="wrap">
<img id="cam" src="/api/stream.mjpg" alt="camera">
<canvas id="ov" width="800" height="450"></canvas>
<canvas id="face" width="160" height="160"></canvas>
</div>
<div style="margin:4px 0">
<input type="button" value="布防/撤防" onclick="cmd('toggle_arm')">
<input type="button" value="归中" onclick="cmd('center')">
<input type="button" value="抓拍" onclick="cmd('snapshot')">
<input type="button" value="清除告警" onclick="cmd('clear_alarm')">
<input type="button" value="立即比对" onclick="cmd('identify')">
<span id="res"></span>
</div>
<fieldset><legend>最近抓拍</legend><span id="snaps"></span></fieldset>
</div>

<div id="right">
<table class="box">
<tr><th>状态</th><td id="state">-</td><th>CPU</th><td id="temp">-</td></tr>
<tr><th>系统</th><td colspan="3" id="sysm" style="font-size:12px">-</td></tr>
<tr><th>云台</th><td id="mode" colspan="3">-</td></tr>
<tr><th>MQTT</th><td id="mq">-</td><th>雷达</th><td id="rad">-</td></tr>
</table>
<fieldset style="margin-top:6px"><legend>目标 / 身份</legend>
<table class="box">
<tr><th>雷达目标</th><td id="tgt">-</td></tr>
<tr><th>视觉</th><td id="vis">-</td></tr>
<tr><th>身份</th><td id="who">-</td></tr>
</table>
</fieldset>
<fieldset><legend>俯视图（雷达）</legend>
<canvas id="plot" width="480" height="300"></canvas>
<small>范围 <select id="zoom"><option value="6000">6 m</option><option value="3000" selected>3 m</option><option value="1500">1.5 m</option></select>
红=人 蓝=待核实 灰=物体 绿线=云台方向</small>
</fieldset>
<fieldset><legend>事件</legend><div id="events"></div></fieldset>
</div>
</div>
<script>
var lastSnaps = "";
var KIND = {face: "人脸", person: "人体", hand: "手", head: "头部(跟踪中)", profile: "侧脸", face_weak: "人脸(弱)"};
var IDS = {pending: "比对中", known: "已知", unknown: "未知", far: "太远，等靠近", mismatch: "不符"};
function cmd(a) { $("res").innerHTML = a + "..."; post("/api/cmd", {action: a}).then(function (j) { $("res").innerHTML = j.ok ? (typeof j.result === "string" ? esc(j.result) : "OK") : ("错误: " + esc(j.error)); }); }
$("cam").onerror = function () { setTimeout(function () { $("cam").src = "/api/stream.mjpg?" + Date.now(); }, 3000); };
function fit(c) {   // keep the canvas pixel size = its displayed size (sharp lines at any width)
  var w = Math.round(c.clientWidth), h = Math.round(c.clientHeight);
  if (w && h && (c.width !== w || c.height !== h)) { c.width = w; c.height = h; }
}
function render(s) {
  $("state").className = (s.state === "LOCKED" && (s.identity || {}).status === "unknown") ? "UNKNOWN" : s.state; $("state").innerHTML = "<b>" + s.state_cn + "</b>" + (s.alarm_left_s ? " " + s.alarm_left_s + "s" : "");
  $("mode").innerHTML = s.guide.mode_cn + " &nbsp; 水平 " + f1(s.guide.pan_cmd) + "° 俯仰 " + f1(s.guide.tilt_cmd) + "°" +
    (s.limits ? " <small>(限位 ±" + s.limits.pan_deg + "° / ±" + s.limits.tilt_deg + "°)</small>" : "");
  var p = s.primary, t = s.vision.fresh ? s.vision.target : null;
  $("tgt").innerHTML = p ? ("T" + p.id + " " + esc(p.kind) + " 距离 " + p.r_m.toFixed(2) + " m 方位 " + f1(p.az_deg) + "°（X " + p.xr_mm + " Y " + p.y_mm + " mm）") : "无";
  $("vis").innerHTML = t ? (KIND[t.kind] || t.kind) + (t.yaw !== undefined ? " 转头 " + f1(t.yaw) + "°" : "") + (t.eye_px ? " 眼距 " + t.eye_px + "px" : "") +
    " 偏差 " + f1(t.eu_deg) + "°/" + f1(t.ev_deg) + "°" + (s.vt.active ? " | 视觉跟踪中" + (s.vt.track_id ? "（雷达 T" + s.vt.track_id + "）" : "") : "")
    : (s.vision.active ? "检测中，没看到人" : "待机");
  var id = s.identity || {};
  $("who").innerHTML = (id.status === "known") ? ("<b><font color=green>已知：" + esc(id.name || s.known_banner) + "</font></b>" +
      (id.score ? " 相似度 " + id.score : "") + (id.t ? " @ " + id.t : "") + (id.inherited ? " <small>（沿用）</small>" : "")) :
    s.known_banner ? ("<b>已知：" + esc(s.known_banner) + "</b>") :
    (id.status ? ((IDS[id.status] || id.status) + (id.name ? " " + esc(id.name) : "") + (id.score ? " 相似度 " + id.score : "") +
      (id.side ? " <small>（侧脸，等正脸再比对）</small>" : "") + (id.error ? " <small>" + esc(id.error) + "</small>" : "")) : "-");
  var M = s.metrics || {};
  $("temp").innerHTML = s.sys.cpu_temp_c + "°C" + (M.cpu_pct !== undefined ? " | " + M.cpu_pct + "% | ≈" + M.power_est.total_w + " W <small>(估算)</small>" : "");
  if (M.mem) {
    var th = M.throttled || {}, cams = s.camera.sleeping ? "<b>休眠</b> <input type=button value='唤醒摄像头' onclick=\"post('/api/cmd',{action:'wake_camera'})\">" : (M.cam_fps + " fps");
    $("sysm").innerHTML = "内存 " + M.mem.used_mb + "/" + M.mem.total_mb + " MB · 负载 " + M.load.join(" ") + " · " + M.cpu_mhz + " MHz · " +
      (th.now && th.now.length ? "<font color=red>" + esc(th.now.join(",")) + "</font>" : "供电正常") + (th.since_boot && th.since_boot.length ? " <small>(开机后曾: " + esc(th.since_boot.join(",")) + ")</small>" : "") +
      " · 运行 " + Math.floor(M.uptime_s / 3600) + "h" + Math.floor(M.uptime_s % 3600 / 60) + "m<br>雷达 " + M.radar_hz + " Hz · 摄像头 " + cams + " · 检测 " + M.vision_hz + " Hz · 时延 " + (M.latency_ms === null ? "-" : M.latency_ms + " ms") +
      " · 舵机 " + Math.round(M.servo_motion * 100) + "% · Wi-Fi " + esc(M.wifi.ssid || "-") + " " + (M.wifi.rssi_dbm === null ? "" : M.wifi.rssi_dbm + " dBm") + " " + esc(M.wifi.ip || "") +
      " · MQTT " + (M.mqtt.connected ? "在线" : "离线") + " 队列 " + M.mqtt.queue + " · 磁盘 " + M.disk.pct + "%" +
      "<br><small>功耗估算: 树莓派 " + M.power_est.pi_w + " + 摄像头 " + M.power_est.camera_w + " + 雷达 " + M.power_est.radar_w + " + 指示 " + M.power_est.hmi_w + " = " + M.power_est.logic_w + " W；舵机(独立电源) " + M.power_est.servo_w + " W</small>";
  }
  $("mq").innerHTML = !s.mqtt.enabled ? "未配置" : (s.mqtt.connected ? "在线" : "离线");
  $("rad").innerHTML = s.radar.open ? (s.radar.fps + " Hz") : "<font color=red>未打开</font>";
  $("clock").innerHTML = s.time + (s.needs_calib ? " <font color=red><b>雷达与云台方向不一致（误差 " + s.assoc_err + "°），请重新标定</b></font>" : "");
  fit($("ov")); fit($("plot"));
  drawOverlay($("ov"), s); drawFace($("cam"), $("face"), s); drawPlot($("plot"), s, Number($("zoom").value));
  $("events").innerHTML = s.events.map(function (e) { return e.t + " <b>" + esc(e.kind) + "</b> " + esc(e.text); }).join("<br>");
  var sn = s.snapshots.join(",");
  if (sn !== lastSnaps) { lastSnaps = sn; $("snaps").innerHTML = s.snapshots.map(function (n) { return '<a href="/snapshots/' + n + '" target="_blank"><img src="/snapshots/' + n + '" border="1"></a>'; }).join(" ") || "无"; }
}
function poll() {
  fetch("/api/state?lite").then(function (r) { return r.json(); }).then(function (s) { $("conn").innerHTML = ""; render(s); })
    .catch(function (e) { $("conn").innerHTML = "连接中断"; }).then(function () { setTimeout(poll, 300); });
}
poll();
</script>
</body>
</html>
